services:
  poker-bank:
    build: .
    restart: unless-stopped
    environment:
      # Shared access code for your group.
      APP_PIN: ${APP_PIN:?Set APP_PIN in .env}
      # Separate PIN for admins (manage players and logged games). Leave empty to disable admin mode.
      ADMIN_PIN: ${ADMIN_PIN:-}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
    volumes:
      - poker-data:/data  # database + daily backups in /data/backups
    ports:
      - "127.0.0.1:3000:3000"  # only for checks on the server itself; the world goes through Traefik
    networks: [traefik]
    labels:
      # Picked up by the Traefik instance already running on the server (it owns ports 80/443).
      traefik.enable: "true"
      traefik.docker.network: ${TRAEFIK_NETWORK:-traefik}
      traefik.http.routers.poker-bank.rule: Host(`${DOMAIN:?Set DOMAIN in .env}`)
      traefik.http.routers.poker-bank.entrypoints: ${TRAEFIK_ENTRYPOINT:-websecure}
      traefik.http.routers.poker-bank.tls.certresolver: ${TRAEFIK_CERTRESOLVER:-letsencrypt}
      traefik.http.routers.poker-bank.middlewares: poker-bank-hsts,poker-bank-compress
      traefik.http.middlewares.poker-bank-hsts.headers.stsSeconds: "31536000"
      traefik.http.middlewares.poker-bank-compress.compress: "true"
      traefik.http.services.poker-bank.loadbalancer.server.port: "3000"

networks:
  traefik:
    external: true
    name: ${TRAEFIK_NETWORK:-traefik}

volumes:
  poker-data:
