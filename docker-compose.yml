services:
  poker-bank:
    build: .
    restart: unless-stopped
    environment:
      # Shared access code for your group.
      APP_PIN: ${APP_PIN:?Set APP_PIN in .env}
      # Separate PIN for admins (manage players and logged games). Leave empty to disable admin mode.
      ADMIN_PIN: ${ADMIN_PIN:-}
      # Play: code needed to create an account. Leave empty to close registration.
      ONLINE_INVITE_CODE: ${ONLINE_INVITE_CODE:-}
      # Play: code to register as an administrator (manages accounts, all tables and Poker Bank). Leave empty to disable.
      ONLINE_ADMIN_CODE: ${ONLINE_ADMIN_CODE:-}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
    volumes:
      - poker-data:/data  # database + daily backups in /data/backups
    ports:
      - "3000:3000"  # only for checks on the server itself; the world goes through Traefik
    networks: [frontend]
    labels:
        - traefik.enable=true
        - traefik.http.routers.poker-websecure.rule=Host(`poker.home.joostgroen.eu`)
        - traefik.http.routers.poker-websecure.entrypoints=websecure
        - traefik.http.services.poker-websecure.loadbalancer.server.port=3000
        - traefik.http.routers.poker-websecure.tls.certresolver=cloudflare
        - traefik.http.routers.poker-websecure.middlewares=poker-buffering
        - traefik.http.middlewares.poker-buffering.buffering.maxResponseBodyBytes=0
        - traefik.http.middlewares.poker-buffering.buffering.memResponseBodyBytes=0
        - traefik.http.services.poker-websecure.loadbalancer.responseforwarding.flushinterval=1ms


networks:
    frontend:
      external: true

volumes:
    poker-data:
